<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create template · Anna S. — Flow (design copy)</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    .vtable { width: 100%; }
    .vtable__head { display: grid; height: 31px; color: var(--c-ink-400); font: 700 12px/18px var(--font); align-items: center; }
    .vtable__row {
      display: grid; align-items: center;
      background: var(--surface); border-radius: var(--radius);
      padding: 8px 0; font: 600 14px/19px var(--font); color: var(--c-ink-500);
      text-decoration: none;
      transition: all var(--t-normal);
    }
    .vtable__row:nth-child(2n) { background: var(--c-white); }
    a.vtable__row:hover { background: rgba(159, 99, 202, 0.2); color: var(--c-ink-500); }
    .vtable .vc { padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vtable .vc--name { color: var(--c-lav-500); font-weight: 700; }
    .vtable .vc .avatar { width: 40px; height: 40px; font-size: 13px; border-radius: var(--radius); vertical-align: middle; margin-right: 8px; }
    .vtable .lady-cell { display: flex; align-items: center; gap: 8px; }
    .vtable .progress { height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
    .vtable .progress i { display: block; height: 100%; background: var(--c-lav-500); border-radius: 3px; }
    .vtable .cell-actions { display: flex; gap: 4px; justify-content: flex-end; padding-right: 10px; }
    .vtable .cell-actions .icon-btn:hover { color: var(--c-lav-500); }

  </style>
</head>
<body data-theme="theme_purple" data-od-id="page" data-od-label="Icebreakers / Lady / Create">
  <header class="appheader" data-od-id="appheader">
    <div class="appheader__left">
      <img class="appheader__logo" src="assets/logos/flow.svg" alt="Flow">
      <div class="account-info">
        <span class="account-info__role">Account</span>
        <span class="account-info__data">
          <span class="account-info__name">Anna S.</span>
          <span class="account-info__id">RL-88421</span>
        </span>
      </div>
    </div>
    <div class="appheader__right">
      <ul class="appmenu">
        <li><a href="omniscience.html" title="Omniscience" aria-label="Omniscience"><span class="ic ic--lightning"></span></a></li>
        <li><a href="statistics.html" title="Statistics" aria-label="Statistics"><span class="ic ic--statistics"></span></a></li>
        <li><a href="newsfeeds.html" title="Newsfeeds" aria-label="Newsfeeds"><span class="ic ic--newsfeed"></span></a></li>
        <li><a href="mails.html" title="Mails" aria-label="Mails"><span class="ic ic--mail"></span></a></li>
        <li><a href="chats.html" title="Accounts" aria-label="Accounts"><span class="ic ic--chat"></span></a></li>
        <li><a href="auto-sendings.html" title="Auto Sendings" aria-label="Auto Sendings"><span class="ic ic--auto-sendings"></span></a></li>
        <li><a class="is-active" href="icebreakers.html" title="Icebreakers" aria-label="Icebreakers" aria-current="page"><span class="ic ic--icebreakers"></span></a></li>
        <li><a href="invites.html" title="Chat Invite" aria-label="Chat Invite"><span class="ic ic--chat-invite"></span></a></li>
        <li><a href="tools.html" title="Tools" aria-label="Tools"><span class="ic ic--settings"></span></a></li>
      </ul>
      <div class="logout">
        <button type="button" data-logout-toggle aria-expanded="false" aria-label="Account menu"><span class="ic ic--more"></span></button>
        <div class="logout__menu" role="menu">
          <button type="button" role="menuitem" onclick="flowToast('Logged out (prototype)')"><span class="ic ic--logout"></span><span>Log out</span></button>
          <button type="button" role="menuitem" onclick="flowToast('Log out of all devices (prototype)')"><span class="ic ic--logout-all"></span><span>Log out of all devices</span></button>
        </div>
      </div>
    </div>
  </header>
  <main class="page" style="padding-top:10px" data-od-id="icebreakers-lady-main">
    <div class="tools-shell">
      <aside class="tsidebar" aria-label="Lady context">
        <a class="back-btn" href="icebreakers.html"><img src="assets/icons/backToIndex.svg" alt=""><span class="nav-text">Back to index</span></a>
        <div class="lady-card">
          <div class="lady-avatar"><span class="avatar-fallback">AS</span></div>
          <span class="lady-name">Anna S., 26</span>
          <span class="lady-platform">
            <span class="pf-ico"><img src="assets/logos/real-loves.svg" alt="RealLoves"></span>
            <span class="platform-name">RealLoves</span>
          </span>
          <dl>
            <dt>ID:</dt><dd>241</dd>
            <dt>ID on site:</dt><dd>884217</dd>
          </dl>
        </div>
        <nav class="nav" aria-label="Sections">
          <ul>
            <li><a href="icebreakers-lady-groups.html"><img src="assets/icons/groupsIco.svg" alt=""><span class="nav-text">Groups</span></a></li>
            <li><a class="is-active" href="icebreakers-lady-messages.html" aria-current="page"><img src="assets/icons/messagesIco.svg" alt=""><span class="nav-text">Messages</span></a></li>
            <li><a href="icebreakers-lady-mails.html"><img src="assets/icons/mailsIco.svg" alt=""><span class="nav-text">Mails</span></a></li>
          </ul>
        </nav>
        <button type="button" class="collapse-btn" data-sidebar-toggle aria-label="Collapse sidebar">
          <svg width="13" height="12" viewBox="0 0 13 12" fill="none" aria-hidden="true"><path d="M12 11L7 6L12 1M6 11L1 6L6 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </aside>
      <section class="tools-content" data-od-id="icebreakers-lady-content" aria-label="Create template">
        <div class="page-head"><h1>Create template</h1></div>
        <div class="form-card" style="max-width:640px">
          <h2>Create new template</h2>
          <div class="field">
            <label for="tpl-type">Type</label>
            <select class="select" id="tpl-type">
              <option>Message</option>
              <option>Mail</option>
            </select>
          </div>
          <div class="field">
            <label for="tpl-text">Template text</label>
            <textarea class="textarea input--fill" id="tpl-text" rows="5" placeholder="Write the icebreaker text…"></textarea>
            <span class="field-hint">Placeholders: {name}, {age}</span>
          </div>
          <div class="field">
            <label>Attachments</label>
            <div class="ar-variants" style="margin-top:6px">
              <button class="ar-variant ar-add-variant" type="button" onclick="flowToast('Attach photo (prototype)')">+ Photo</button>
              <button class="ar-variant ar-add-variant" type="button" onclick="flowToast('Attach video (prototype)')">+ Video</button>
            </div>
          </div>
          <div class="form-actions">
            <a class="btn btn--ghost" href="icebreakers-lady-messages.html">Cancel</a>
            <button class="btn btn--primary" onclick="flowToast('Template sent on moderation (prototype)')">Save</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
