<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add new schedule — Flow (design copy)</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    .trange { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .trange__track {
      position: relative;
      flex: 1;
      height: 28px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .trange__fill {
      position: absolute; top: 0; bottom: 0;
      background: rgba(var(--link-color-rgb), 0.25);
      border-left: 3px solid var(--link-color);
      border-right: 3px solid var(--link-color);
      border-radius: 3px;
    }
    .trange__disabled { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--c-ink-200), var(--c-ink-200) 4px, transparent 4px, transparent 8px); }
    .trange__times { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
    .trange__times input { width: 62px; }
    .add-time { display: flex; align-items: center; gap: 10px; margin-top: 14px; cursor: pointer; color: var(--link-color); font-weight: 600; font-size: 14px; }
    .add-time .icon-plus {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--link-color); color: var(--link-color);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1;
    }
    .add-time:hover .icon-plus { background: var(--link-color); color: #fff; }
  </style>
</head>
<body data-od-id="page" data-od-label="Administrator / Schedules / New">
  <header class="appheader" data-od-id="appheader">
    <div class="appheader__left">
      <img class="appheader__logo" src="assets/logos/flow.svg" alt="Flow">
      <div class="account-info">
        <span class="account-info__role">Admin</span>
        <span class="account-info__data">
          <span class="account-info__name">Flow Admin</span>
          <span class="account-info__id">FL-ADM-01</span>
        </span>
      </div>
    </div>
    <div class="appheader__right">
      <ul class="appmenu">
        <li><a href="omniscience.html" title="Omniscience" aria-label="Omniscience"><span class="ic ic--lightning"></span></a></li>
        <li><a href="statistics.html" title="Statistics" aria-label="Statistics"><span class="ic ic--statistics"></span></a></li>
        <li><a href="mails.html" title="Mails" aria-label="Mails"><span class="ic ic--mail"></span></a></li>
        <li><a href="chats.html" title="Accounts" aria-label="Accounts"><span class="ic ic--chat"></span></a></li>
        <li><a href="invites.html" title="Chat Invite" aria-label="Chat Invite"><span class="ic ic--chat-invite"></span></a></li>
        <li><a class="is-active" href="admin-dashboard.html" title="Administrator" aria-label="Administrator" aria-current="page"><span class="ic ic--crown"></span></a></li>
        <li><a href="tools.html" title="Tools" aria-label="Tools"><span class="ic ic--settings"></span></a></li>
      </ul>
      <div class="logout">
        <button type="button" data-logout-toggle aria-expanded="false" aria-label="Account menu"><span class="ic ic--more"></span></button>
        <div class="logout__menu" role="menu">
          <button type="button" role="menuitem" onclick="flowToast('Logged out (prototype)')"><span class="ic ic--logout"></span><span>Log out</span></button>
          <button type="button" role="menuitem" onclick="flowToast('Log out of all devices (prototype)')"><span class="ic ic--logout-all"></span><span>Log out of all devices</span></button>
        </div>
      </div>
    </div>
  </header>

  <div class="admin-wrap">
    <aside class="sidebar" data-od-id="admin-sidebar">
      <nav class="sidebar__nav">
        <ul>
          <li><a href="admin-dashboard.html"><img src="assets/icons/dashboard.svg" alt=""><span class="sidebar__text">Dashboard</span></a></li>
          <li><a href="admin-accounts.html"><img src="assets/icons/accounts.svg" alt=""><span class="sidebar__text">Accounts</span></a></li>
          <li><a href="admin-lady-profiles.html"><img src="assets/icons/lady_profiles.svg" alt=""><span class="sidebar__text">Lady Profiles</span></a></li>
          <li><a class="is-active" href="admin-schedules.html"><img src="assets/icons/schedules.svg" alt=""><span class="sidebar__text">Schedules</span></a></li>
        </ul>
      </nav>
      <button type="button" class="sidebar__collapse" data-sidebar-toggle aria-label="Toggle sidebar">
        <svg width="13" height="12" viewBox="0 0 13 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 11L7 6L12 1M6 11L1 6L6 0.999999" stroke="#fff" opacity=".5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </aside>

    <main class="admin-main">
      <div class="content-card">
        <div class="form-card" style="max-width:640px">
          <h1>Add new schedule</h1>
          <form onsubmit="return false">
            <div class="field" style="margin-bottom:10px">
              <label for="f-name">Name</label>
              <input class="input input--fill" type="text" id="f-name" autocomplete="off">
            </div>
            <div class="field" style="margin-bottom:18px">
              <label for="f-tz">Time zone</label>
              <select class="select" id="f-tz">
                <option value="" selected>Please select</option>
                <option>UTC</option>
                <option>Europe/Kiev</option>
                <option>Europe/Warsaw</option>
                <option>America/New_York</option>
              </select>
            </div>

            <div class="trange">
              <div class="trange__times">
                <input class="input input--fill" type="time" value="08:00" aria-label="From">
                <span>–</span>
                <input class="input input--fill" type="time" value="16:00" aria-label="To">
              </div>
              <div class="trange__track" aria-hidden="true">
                <div class="trange__disabled" style="left:0;width:33.3%"></div>
                <div class="trange__fill" style="left:33.3%;width:33.4%"></div>
                <div class="trange__disabled" style="right:0;width:33.3%"></div>
              </div>
              <button class="act" type="button" disabled title="Delete" aria-label="Delete range"><span class="ic ic--bucket"></span></button>
            </div>
            <div class="trange">
              <div class="trange__times">
                <input class="input input--fill" type="time" value="16:00" aria-label="From">
                <span>–</span>
                <input class="input input--fill" type="time" value="20:00" aria-label="To">
              </div>
              <div class="trange__track" aria-hidden="true">
                <div class="trange__disabled" style="left:0;width:66.7%"></div>
                <div class="trange__fill" style="left:66.7%;width:16.6%"></div>
                <div class="trange__disabled" style="right:0;width:16.7%"></div>
              </div>
              <button class="act" type="button" title="Delete" aria-label="Delete range"
                      onclick="this.closest('.trange').remove();flowToast('Time range removed (prototype)')">
                <span class="ic ic--bucket"></span>
              </button>
            </div>

            <div class="add-time" role="button" tabindex="0" onclick="flowToast('New time range added (prototype)')">
              <span class="icon-plus">+</span>
              <span>Add working hours</span>
            </div>

            <div class="form-actions">
              <a class="btn btn--ghost" href="admin-schedules.html">Cancel</a>
              <button type="submit" class="btn btn--primary" onclick="flowToast('Schedule created (prototype)')">Save</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
